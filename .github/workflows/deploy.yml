# Olho de Tandera — deploy automático para Cloudflare Pages
# A cada push na branch principal: build → Workers no ar → migrations D1 → secrets do Travelpayouts.
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — perfil "Edit Cloudflare Workers" (dash.cloudflare.com → My Profile → API Tokens)
#   CLOUDFLARE_ACCOUNT_ID  — barra lateral direita do dashboard Cloudflare
#   TRAVELPAYOUTS_TOKEN    — painel travelpayouts.com
#   TRAVELPAYOUTS_MARKER   — painel travelpayouts.com
#
# Antes do primeiro push: crie o banco D1 uma única vez
# (dash.cloudflare.com → Workers & Pages → D1 → Create database → nome: olhodetandera)

name: deploy

on:
  push:
    branches: [main, master]  # ajuste para a branch padrão do seu repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        # --ignore-scripts: o postinstall do esbuild enforca o npm no runner
        # (bug "Exit handler never called"); o build não precisa dele
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build (Vite → dist/)
        run: npm run build

      - name: Aplicar migrations no D1
        run: npx wrangler d1 migrations apply olhodetandera --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ID }}

      - name: Deploy no Cloudflare Pages (site + Workers)
        run: npx wrangler pages deploy dist --project-name=olhodetandera
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ID }}

      - name: Configurar secrets do Travelpayouts no Pages (se existirem)
        run: |
          if [ -n "$TP_TOKEN" ]; then
            echo "$TP_TOKEN" | npx wrangler pages secret put TRAVELPAYOUTS_TOKEN --project-name=olhodetandera
            echo "$TP_MARKER" | npx wrangler pages secret put TRAVELPAYOUTS_MARKER --project-name=olhodetandera
          else
            echo "TRAVELPAYOUTS_TOKEN ausente — pulando (site segue com ofertas demo)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ID }}
          TP_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TP_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
