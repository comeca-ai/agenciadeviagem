<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="irisCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C877"/>
      <stop offset="30%" stop-color="#F0A832"/>
      <stop offset="62%" stop-color="#E4572E"/>
      <stop offset="72%" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35C4B5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#35C4B5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer thin gold ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#F0A832" stroke-width="6"/>
  <!-- middle dashed ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#F0A832" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="14 18"/>
  <!-- iris core -->
  <circle cx="256" cy="256" r="150" fill="url(#irisCore)"/>
  <!-- dark pupil -->
  <circle cx="256" cy="256" r="58" fill="#06080F"/>
  <!-- teal glint northeast -->
  <circle cx="316" cy="196" r="30" fill="url(#tealGlint)"/>
</svg>
