# Olho de Tandera — Cloudflare Pages
name = "olhodetandera"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Banco SQLite da Cloudflare (D1) — autenticação + alertas de preço (v2)
# Crie com: npx wrangler d1 create olhodetandera
# e cole o database_id retornado abaixo. No Pages, o binding DB também pode
# ser configurado em Settings → Functions → D1 database bindings.
[[d1_databases]]
binding = "DB"
database_name = "olhodetandera"
database_id = "PREENCHER_APOS_CRIAR"
migrations_dir = "migrations"
